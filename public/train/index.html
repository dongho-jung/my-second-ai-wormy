<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wormy II — training</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <h1>Wormy II · training</h1>
      <div class="status">
        <span class="chip" id="status">connecting</span>
        <select id="runs" aria-label="Run"></select>
        <button id="watch" type="button" disabled>Watch</button>
      </div>
      <div class="dim" id="heading">—</div>
    </header>

    <p class="alert" id="alert" hidden></p>

    <section class="headlines" id="headlines" hidden></section>

    <section class="figures" id="figures"></section>

    <main class="charts" id="charts"></main>

    <section class="panel" id="notes-panel" hidden>
      <div class="panel-head"><h2>Log</h2></div>
      <ul class="notes" id="notes"></ul>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Settings</h2>
        <span class="dim">decided when this run started</span>
      </div>
      <ul class="facts" id="meta"></ul>
    </section>
  </body>
</html>
